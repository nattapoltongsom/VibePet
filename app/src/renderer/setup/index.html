<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibePet</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="titlebar-drag"></div>
  <main class="container">
    <section class="section">
      <h2>Pet</h2>
      <div class="character-grid" id="character-grid">
        <button class="char-card" data-char="cat" type="button">Cat</button>
        <button class="char-card" data-char="robot" type="button">Robot</button>
        <button class="char-card" data-char="dog" type="button">Dog</button>
      </div>
    </section>

    <section class="section">
      <h2>Tools</h2>
      <div id="integrations-list" class="integrations-list"></div>
    </section>

    <footer class="footer">
      <button id="done-btn" class="btn-done" type="button">Done</button>
    </footer>
  </main>

  <script src="./setup.js"></script>
</body>
</html>
