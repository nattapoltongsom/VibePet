<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibePet</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-state="idle" data-character="cat">
  <div class="stage">
    <!-- Speech Bubble -->
    <div class="bubble-slot">
      <div id="speech-bubble" class="speech-bubble interactive" title="Click to dismiss">
        <div class="bubble-header">
          <div class="bubble-meta">
            <span id="source-badge" class="source-badge antigravity">✦ Antigravity</span>
            <span id="project-badge" class="project-badge"></span>
          </div>
          <span class="state-pill">
            <span class="state-dot"></span>
            <span id="state-label">READY</span>
          </span>
        </div>
        <div id="model-row" class="model-row">
          <span id="model-badge" class="model-badge"></span>
        </div>
        <p id="bubble-text" class="bubble-text"></p>
        <p id="bubble-thought" class="bubble-thought"></p>
      </div>
    </div>

    <!-- Pet Zone + Hover Controls -->
    <div id="pet-zone" class="pet-zone interactive">
      <div class="hover-controls interactive">
        <button id="setup-btn" class="ctrl-btn interactive" title="Characters & Integrations" aria-label="Setup and Characters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="mute-btn" class="ctrl-btn interactive" title="Mute / Unmute sound" aria-label="Toggle Sound">
          <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="icon-sound-off" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <button id="quit-btn" class="ctrl-btn quit-btn interactive" title="Quit VibePet" aria-label="Quit VibePet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div id="character-host" class="character-host"></div>
    </div>
  </div>

  <script src="./characters.js"></script>
  <script src="./audio.js"></script>
  <script src="./pet.js"></script>
</body>
</html>
