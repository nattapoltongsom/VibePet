name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck TypeScript sources
        working-directory: app
        run: npm run typecheck

      - name: Generate macOS app icon
        working-directory: app
        run: npm run generate:icon

      - name: Build macOS .app archive
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Quick Install (macOS Apple Silicon — Free & Open Source)
            Run this one-line command in Terminal (no Gatekeeper warning):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/nattapoltongsom/VibePet/main/install.sh | bash
            ```
          files: |
            app/dist/VibePet-arm64.zip
